<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- [НЕ УДАЛЯТЬ] viewport: без него медиа-запросы для телефона в style.css не сработают
         (в старой версии этой строки не было). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактор дисциплин</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <!-- [НЕ УДАЛЯТЬ] применяет тему до отрисовки (нет белой вспышки). Ключ 'theme' = Quiz.config.KEYS.theme -->
    <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body>
    <!-- [НЕ УДАЛЯТЬ] id="admin" — сюда admin.js рисует редактор -->
    <div class="container" id="admin" style="max-width:1100px"></div>

    <!-- [ПОРЯДОК ВАЖЕН] config → utils → store → layout → theme → auth → скрипт страницы.
         Новый общий скрипт добавляйте ПОСЛЕ auth.js и ДО скрипта страницы. -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
