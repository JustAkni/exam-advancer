<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- [НЕ УДАЛЯТЬ] viewport: без него медиа-запросы для телефона в style.css не сработают
         (в старой версии этой строки не было). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тест</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- [НЕ УДАЛЯТЬ] применяет тему до отрисовки (нет белой вспышки). Ключ 'theme' = Quiz.config.KEYS.theme -->
    <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body>
    <div class="container">
        <!-- [НЕ УДАЛЯТЬ] id="categoryTitle" и id="quiz" — их ищет js/quiz.js -->
        <h2 id="categoryTitle"></h2>
        <div id="quiz"></div>
    </div>

    <!-- [ПОРЯДОК ВАЖЕН] config → utils → store → theme → auth → скрипт страницы.
         Новый общий скрипт добавляйте ПОСЛЕ auth.js и ДО скрипта страницы. -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
