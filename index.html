<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- [НЕ УДАЛЯТЬ] viewport: без него медиа-запросы для телефона в style.css не сработают. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exam-Advancer | Тесты</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <!-- [НЕ УДАЛЯТЬ] до отрисовки применяет тему (ключ 'theme'), дизайн (ключ 'design') и включает «занавес» после перехода (ключ 'pt', см. js/transition.js). -->
    <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');if(localStorage.getItem('design')==='classic')document.documentElement.setAttribute('data-design','classic');if(sessionStorage.getItem('pt')){sessionStorage.removeItem('pt');document.documentElement.classList.add('pt-arrive')}}catch(e){}</script>
</head>
<body class="scene-menu home-lock">
    <!-- [НЕ УДАЛЯТЬ] id="app": home.js рисует главную именно сюда. -->
    <div class="scene" id="app"></div>

    <!-- [ПОРЯДОК ВАЖЕН] config → utils → store → layout → theme → transition → (assistant) → скрипт страницы. -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/transition.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
